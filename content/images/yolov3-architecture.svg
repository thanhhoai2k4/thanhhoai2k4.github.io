<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="backbone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2b3d"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f38ba8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fab387"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a6e3a1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="640" rx="16" fill="url(#bg-grad)" stroke="#45475a" stroke-width="1.5"/>

  <!-- Top Header -->
  <text x="540" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#cdd6f4" letter-spacing="0.5">Kiến Trúc Tổng Thể YOLOv3 &amp; Darknet-53</text>
  <text x="540" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6adc8">Chi tiết kích thước Kernel (K), Bước nhảy Stride (S), Viền Padding (P) &amp; Số bộ lọc Filters</text>

  <!-- Formula Callout Banner -->
  <g transform="translate(140, 68)" filter="url(#shadow)">
    <rect width="800" height="34" rx="8" fill="#11111b" stroke="#89b4fa" stroke-width="1"/>
    <text x="400" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#cdd6f4">
      <tspan fill="#f9e2af" font-weight="700">Công thức:</tspan> O = ⌊(W - K + 2P)/S⌋ + 1  |  
      <tspan fill="#89b4fa">K = Kernel</tspan> | 
      <tspan fill="#a6e3a1">P = Padding</tspan> | 
      <tspan fill="#fab387">S = Stride</tspan> | 
      <tspan fill="#f38ba8">Filters = Số kênh đầu ra (C)</tspan>
    </text>
  </g>

  <!-- Column 1: Input -->
  <g transform="translate(30, 115)" filter="url(#shadow)">
    <rect width="100" height="495" rx="12" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.5"/>
    <rect x="0" y="0" width="100" height="36" rx="12" fill="#89b4fa" opacity="0.15"/>
    <text x="50" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#89b4fa">INPUT</text>

    <rect x="15" y="55" width="70" height="70" rx="8" fill="#11111b" stroke="#45475a"/>
    <text x="50" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">Image</text>
    <text x="50" y="106" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#a6adc8">416x416</text>

    <text x="50" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cdd6f4">3 Channels</text>
    <text x="50" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9399b2">(R, G, B)</text>
    <text x="50" y="320" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">W = 416</text>
    <text x="50" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">H = 416</text>
  </g>

  <!-- Arrow Input -> Backbone -->
  <line x1="130" y1="360" x2="160" y2="360" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Column 2: Backbone: Darknet-53 -->
  <g transform="translate(165, 115)" filter="url(#shadow)">
    <rect width="365" height="495" rx="12" fill="url(#backbone-grad)" stroke="#45475a" stroke-width="1.5"/>
    <rect x="0" y="0" width="365" height="36" rx="12" fill="#313244"/>
    <text x="182" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#cdd6f4">BACKBONE: Darknet-53 (53 Conv Layers)</text>

    <!-- Conv Layer 0 -->
    <g transform="translate(12, 45)">
      <rect width="341" height="46" rx="6" fill="#181825" stroke="#585b70"/>
      <text x="10" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#89b4fa">Conv 3x3 <tspan font-weight="400" fill="#a6adc8">(K=3, S=1, P=1)</tspan></text>
      <text x="10" y="36" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 32 (Số Kernel = 32)</text>
      <rect x="235" y="10" width="96" height="26" rx="4" fill="#313244"/>
      <text x="283" y="27" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#cdd6f4">416x416x32</text>
    </g>

    <!-- Stage 1 -->
    <g transform="translate(12, 98)">
      <rect width="341" height="58" rx="6" fill="#181825" stroke="#585b70"/>
      <text x="10" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#cdd6f4">Conv 3x3 <tspan fill="#fab387">(S=2, P=1)</tspan> | <tspan fill="#89b4fa">Res x1</tspan></text>
      <text x="10" y="34" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 64 (Số Kernel = 64)</text>
      <text x="10" y="50" font-family="sans-serif" font-size="9" fill="#9399b2">Downsample: (416 - 3 + 2)/2 + 1 = 208</text>
      <rect x="235" y="16" width="96" height="26" rx="4" fill="#313244"/>
      <text x="283" y="33" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#cdd6f4">208x208x64</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(12, 163)">
      <rect width="341" height="58" rx="6" fill="#181825" stroke="#585b70"/>
      <text x="10" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#cdd6f4">Conv 3x3 <tspan fill="#fab387">(S=2, P=1)</tspan> | <tspan fill="#89b4fa">Res x2</tspan></text>
      <text x="10" y="34" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 128 (Số Kernel = 128)</text>
      <text x="10" y="50" font-family="sans-serif" font-size="9" fill="#9399b2">Downsample: (208 - 3 + 2)/2 + 1 = 104</text>
      <rect x="235" y="16" width="96" height="26" rx="4" fill="#313244"/>
      <text x="283" y="33" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#cdd6f4">104x104x128</text>
    </g>

    <!-- Stage 3 (Route to Scale 3) -->
    <g transform="translate(12, 228)">
      <rect width="341" height="72" rx="6" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
      <text x="10" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#a6e3a1">Stage 3: Conv 3x3 (S=2, P=1) | Res x8</text>
      <text x="10" y="36" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 256 (Số Kernel = 256)</text>
      <text x="10" y="52" font-family="sans-serif" font-size="9" fill="#a6e3a1">Stride 8 (Features chi tiết vật thể nhỏ)</text>
      <text x="10" y="66" font-family="sans-serif" font-size="9" fill="#9399b2">Downsample: (104 - 3 + 2)/2 + 1 = 52</text>
      <rect x="235" y="23" width="96" height="26" rx="4" fill="#11111b" stroke="#a6e3a1"/>
      <text x="283" y="40" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#a6e3a1">52x52x256</text>
    </g>

    <!-- Stage 4 (Route to Scale 2) -->
    <g transform="translate(12, 307)">
      <rect width="341" height="72" rx="6" fill="#181825" stroke="#fab387" stroke-width="1.5"/>
      <text x="10" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#fab387">Stage 4: Conv 3x3 (S=2, P=1) | Res x8</text>
      <text x="10" y="36" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 512 (Số Kernel = 512)</text>
      <text x="10" y="52" font-family="sans-serif" font-size="9" fill="#fab387">Stride 16 (Features vật thể tầm trung)</text>
      <text x="10" y="66" font-family="sans-serif" font-size="9" fill="#9399b2">Downsample: (52 - 3 + 2)/2 + 1 = 26</text>
      <rect x="235" y="23" width="96" height="26" rx="4" fill="#11111b" stroke="#fab387"/>
      <text x="283" y="40" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fab387">26x26x512</text>
    </g>

    <!-- Stage 5 (Route to Scale 1) -->
    <g transform="translate(12, 386)">
      <rect width="341" height="72" rx="6" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
      <text x="10" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#f38ba8">Stage 5: Conv 3x3 (S=2, P=1) | Res x4</text>
      <text x="10" y="36" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 1024 (Số Kernel = 1024)</text>
      <text x="10" y="52" font-family="sans-serif" font-size="9" fill="#f38ba8">Stride 32 (Ngữ nghĩa sâu vật thể lớn)</text>
      <text x="10" y="66" font-family="sans-serif" font-size="9" fill="#9399b2">Downsample: (26 - 3 + 2)/2 + 1 = 13</text>
      <rect x="235" y="23" width="96" height="26" rx="4" fill="#11111b" stroke="#f38ba8"/>
      <text x="283" y="40" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#f38ba8">13x13x1024</text>
    </g>

    <text x="182" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6c7086">Mỗi ResBlock gồm Conv 1x1 (nén kênh) + Conv 3x3 (tính đặc trưng) + Skip</text>
  </g>

  <!-- Routing Lines -->
  <!-- Line Stage 5 -> Scale 1 -->
  <path d="M 530 535 L 750 535" fill="none" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <!-- Upsample to Scale 2 -->
  <path d="M 580 535 L 580 380 L 610 380" fill="none" stroke="#fab387" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M 530 455 L 560 455 L 560 400 L 610 400" fill="none" stroke="#fab387" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Fusion Block Scale 2 -->
  <g transform="translate(615, 360)" filter="url(#shadow)">
    <rect width="105" height="60" rx="8" fill="#1e1e2e" stroke="#fab387" stroke-width="1.5"/>
    <text x="52" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#fab387">Upsample 2x</text>
    <text x="52" y="42" text-anchor="middle" font-family="monospace" font-size="9" fill="#cdd6f4">+ Concat 26x26</text>
  </g>
  <line x1="720" y1="390" x2="750" y2="390" stroke="#fab387" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Upsample to Scale 3 -->
  <path d="M 667 360 L 667 235 L 690 235" fill="none" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 530 375 L 560 375 L 560 255 L 690 255" fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Fusion Block Scale 3 -->
  <g transform="translate(695, 215)" filter="url(#shadow)">
    <rect width="105" height="60" rx="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="52" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#a6e3a1">Upsample 2x</text>
    <text x="52" y="42" text-anchor="middle" font-family="monospace" font-size="9" fill="#cdd6f4">+ Concat 52x52</text>
  </g>
  <line x1="800" y1="245" x2="830" y2="245" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Column 3: 3 Detection Heads -->
  
  <!-- Scale 3: Small Objects -->
  <g transform="translate(835, 180)" filter="url(#shadow)">
    <rect width="215" height="120" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
    <rect x="0" y="0" width="215" height="28" rx="10" fill="#a6e3a1" opacity="0.2"/>
    <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#a6e3a1">SCALE 3: VẬT THỂ NHỎ</text>
    <text x="12" y="48" font-family="monospace" font-size="13" font-weight="700" fill="#cdd6f4">52 x 52 x 255</text>
    <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 255 = 3x(4+1+80)</text>
    <text x="12" y="86" font-family="sans-serif" font-size="10" fill="#a6adc8">Grid 52x52 (8,112 boxes)</text>
    <text x="12" y="104" font-family="sans-serif" font-size="9" fill="#94e2d5">Stride = 8 | Anchors: (10,13), (16,30), (33,23)</text>
  </g>

  <!-- Scale 2: Medium Objects -->
  <g transform="translate(755, 330)" filter="url(#shadow)">
    <rect width="295" height="120" rx="10" fill="#181825" stroke="#fab387" stroke-width="2"/>
    <rect x="0" y="0" width="295" height="28" rx="10" fill="#fab387" opacity="0.2"/>
    <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#fab387">SCALE 2: VẬT THỂ VỪA</text>
    <text x="12" y="48" font-family="monospace" font-size="13" font-weight="700" fill="#cdd6f4">26 x 26 x 255</text>
    <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 255 = 3x(4+1+80)</text>
    <text x="12" y="86" font-family="sans-serif" font-size="10" fill="#a6adc8">Grid 26x26 (2,028 boxes)</text>
    <text x="12" y="104" font-family="sans-serif" font-size="9" fill="#f9e2af">Stride = 16 | Anchors: (30,61), (62,45), (59,119)</text>
  </g>

  <!-- Scale 1: Large Objects -->
  <g transform="translate(755, 475)" filter="url(#shadow)">
    <rect width="295" height="120" rx="10" fill="#181825" stroke="#f38ba8" stroke-width="2"/>
    <rect x="0" y="0" width="295" height="28" rx="10" fill="#f38ba8" opacity="0.2"/>
    <text x="12" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#f38ba8">SCALE 1: VẬT THỂ LỚN</text>
    <text x="12" y="48" font-family="monospace" font-size="13" font-weight="700" fill="#cdd6f4">13 x 13 x 255</text>
    <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#f38ba8">Filters = 255 = 3x(4+1+80)</text>
    <text x="12" y="86" font-family="sans-serif" font-size="10" fill="#a6adc8">Grid 13x13 (507 boxes)</text>
    <text x="12" y="104" font-family="sans-serif" font-size="9" fill="#eba0ac">Stride = 32 | Anchors: (116,90), (156,198), (373,326)</text>
  </g>

</svg>
